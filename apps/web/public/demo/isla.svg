<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Isla inventada para la pregunta de pin del quiz de demostración. El faro está en (75 %, 25 %). -->
  <defs>
    <pattern id="olas" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 4 20 10 T40 10" fill="none" stroke="#7fd3f0" stroke-width="2" opacity=".6"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#2a9fd6"/>
  <rect width="800" height="500" fill="url(#olas)"/>
  <path d="M140 300 C120 200 230 110 360 120 C470 70 640 60 690 150 C750 250 700 380 560 410 C430 450 260 440 190 400 C150 380 150 340 140 300Z" fill="#f2d48a"/>
  <path d="M175 300 C165 215 250 145 360 150 C465 105 615 100 655 170 C700 255 660 360 545 385 C430 415 270 410 210 380 C180 365 180 330 175 300Z" fill="#6cc04a"/>
  <!-- Montaña -->
  <path d="M250 330 L320 210 L390 330Z" fill="#8d6e63"/>
  <path d="M300 245 L320 210 L340 245 L328 238 L320 250 L311 238Z" fill="#fff"/>
  <!-- Lago -->
  <ellipse cx="470" cy="300" rx="60" ry="32" fill="#3fb6e8"/>
  <!-- Bosque -->
  <g fill="#2e7d32">
    <circle cx="520" cy="200" r="16"/><circle cx="545" cy="215" r="14"/><circle cx="500" cy="225" r="13"/>
    <circle cx="420" cy="190" r="14"/><circle cx="440" cy="210" r="12"/>
  </g>
  <!-- Pueblo -->
  <g>
    <rect x="215" y="350" width="26" height="20" fill="#ff8a65"/><path d="M211 350 L228 336 L245 350Z" fill="#c62828"/>
    <rect x="252" y="356" width="22" height="16" fill="#fff59d"/><path d="M248 356 L263 344 L278 356Z" fill="#c62828"/>
  </g>
  <!-- Faro (respuesta correcta) -->
  <g transform="translate(600 125)">
    <path d="M-12 30 L-8 -25 L8 -25 L12 30Z" fill="#fff"/>
    <rect x="-10" y="-8" width="20" height="8" fill="#e53935"/>
    <rect x="-11" y="12" width="22" height="8" fill="#e53935"/>
    <rect x="-9" y="-38" width="18" height="13" fill="#ffe14d"/>
    <path d="M-12 -38 L0 -50 L12 -38Z" fill="#37474f"/>
  </g>
  <!-- Barco -->
  <g transform="translate(110 120)">
    <path d="M-30 0 L30 0 L20 14 L-20 14Z" fill="#6d4c41"/>
    <path d="M0 0 L0 -40 L24 -6Z" fill="#fff"/>
  </g>
  <text x="400" y="480" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff" opacity=".85">Isla Rush</text>
</svg>
